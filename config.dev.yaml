# Config overlay for local development with Docker Compose; NOT for
# deployments, which must set their own public host name and service info
# instead (see "Configuration" in the documentation, `docs/configuration.md`)
custom:
  # Host name of the app as published by `docker-compose.yaml`, for the
  # `self_uri` (`drs://localhost/<id>`) of objects
  drs:
    hostname: localhost
