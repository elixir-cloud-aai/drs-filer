# Config overlay for local development with Docker Compose; NOT for
# deployments, which must set their own public host name and service info, and
# their identity provider, audience, group claim and admin group instead
# (see "Configuration" in the documentation, `docs/configuration.md`)
security:
  auth:
    # A fictitious identity provider, as the app refuses to start without
    # trusted issuers; set your identity provider in an overlay of your own
    # to send requests with tokens (writes need a token; without one, they
    # are refused with `401 Unauthorized`), or disable authentication (see
    # "Running without authentication" in `docs/development.md`)
    issuers:
      - https://login.example.org/oidc/
    # Accept tokens for any audience (i.e., of any app); with your own
    # identity provider, set `audience` (your client ID) and
    # `verify_audience: True` in your overlay, or tokens issued for any
    # other app of that provider are accepted too
    verify_audience: False
  access_control:
    # Start without admin groups (nobody can write until one is mapped in an
    # overlay of your own)
    require_admin: False
    # The claim with the groups of users (an example; set that of your
    # identity provider in an overlay of your own)
    claim_groups: groups
custom:
  # Host name of the app as published by `docker-compose.yaml`, for the
  # `self_uri` (`drs://localhost/<id>`) of objects
  drs:
    hostname: localhost
