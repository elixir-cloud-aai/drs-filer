[build-system]
# The dependency group `build-system` lists the same requirements, which the
# image build installs from the lock (`Dockerfile`), with their hashes
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
# The Python of the base image (`Dockerfile`)
target-version = "py312"

[tool.ruff.lint]
# The rule set shared by FOCA and FOCA apps: FOCA's rules plus `G` and `S`;
# unlike in FOCA, `D` applies everywhere, also to the tests and scripts
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle (docstrings)
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # Complexity limits, as in FOCA: some functions mirror the API's
    # operations or take many test fixtures, and splitting them would obscure
    # them
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    # Flags HTTP status codes and other literals (e.g., lengths), which are
    # clear as is
    "PLR2004",  # magic-value-comparison
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["drs_filer", "tests"]

[tool.ruff.lint.per-file-ignores]
# pytest checks with `assert`
"tests/**" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["drs_filer", "scripts", "tests"]
python_version = "3.12"
# Complete type hints: all functions annotated, generic types parametrized
# (instead of ruff's `ANN` rules, which report missing hints only, without
# checking them)
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true

# Connexion 2 ships no type information
[[tool.mypy.overrides]]
module = ["connexion", "connexion.*"]
ignore_missing_imports = true

# Gunicorn ships no type information
[[tool.mypy.overrides]]
module = ["gunicorn", "gunicorn.*"]
ignore_missing_imports = true

# mongomock ships no type information (used by the tests only)
[[tool.mypy.overrides]]
module = ["mongomock", "mongomock.*"]
ignore_missing_imports = true

# FOCA attaches its config to Flask's config at runtime (`app.config.foca`),
# which the tests set up directly, also calling the undecorated controllers
# (`__wrapped__`), and keeps the app's own section (`endpoints`) as an extra
# field of its model, which the tests pass to `Config()`; the app code reads
# them through `drs_filer.utils`
[[tool.mypy.overrides]]
module = ["tests.ga4gh.*"]
disable_error_code = ["attr-defined", "call-arg"]

[tool.coverage.run]
source = ["drs_filer", "scripts"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
# `coverage report` (CI) fails below 100%; Codecov's targets are the same
# (`codecov.yml`)
fail_under = 100

[project]
name = "drs-filer"
authors = [
    {name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org"},
]
keywords = [
    "ga4gh", "drs", "data", "repository", "elixir", "cloud", "rest",
    "restful", "api", "app", "server", "openapi", "swagger", "mongodb",
    "python", "flask",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
# The Python version of the base image in the `Dockerfile`, the only one the
# app is tested with
requires-python = ">=3.12"
description = "GA4GH Data Repository Service (DRS) implementation by ELIXIR On-Cloud"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    # FOCA is bumped by hand, together with the base image in the
    # `Dockerfile`, which must have the locked FOCA release
    "foca>=0.22.0,<0.23",
    "gunicorn>=26.2.0,<28",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Local hooks of `.pre-commit-config.yaml` use these too
dev = [
    "ast-grep-cli>=0.51",
    "coverage>=7.10",
    "mongomock>=4.3",
    "mypy>=2.4",
    "packaging>=25.0",
    "pre-commit>=4.6",
    "pytest>=8.4",
    # Used by the tests; builds use `build-system.requires`
    "setuptools-scm>=8",
    "types-jsonschema>=4.17",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31",
    # Locks the dependencies (`uv lock`); the tests export the lock with it
    "uv>=0.12",
]
# Documentation (MkDocs, as in the other FOCA apps of ELIXIR On-Cloud)
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings-python>=1.18,<3",
]

[dependency-groups]
# The build requirements of the app (the same as `build-system.requires`,
# checked by the tests), locked in `uv.lock` with their hashes, so that the
# image build installs them hash-checked
build-system = ["setuptools>=77", "setuptools-scm>=8"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/drs-filer"
Issues = "https://github.com/elixir-cloud-aai/drs-filer/issues"

[tool.setuptools_scm]
# Version from Git tags (`vX.Y.Z`); builds without Git metadata (e.g., Docker
# builds, which get no `.git`) report the fallback unless
# `SETUPTOOLS_SCM_PRETEND_VERSION` is set
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["drs_filer*"]

[tool.setuptools.package-data]
drs_filer = [
    "config.yaml",
    "api/*.yaml",
]
