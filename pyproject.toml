[build-system]
# The dependency group `build-system` lists the same requirements, which the
# image build installs from the lock (`Dockerfile`), with their hashes
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["drs_filer"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[project]
name = "drs-filer"
authors = [
    {name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org"},
]
keywords = [
    "ga4gh", "drs", "data", "repository", "elixir", "cloud", "rest",
    "restful", "api", "app", "server", "openapi", "swagger", "mongodb",
    "python", "flask",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
# The Python version of the base image in the `Dockerfile`, the only one the
# app is tested with. FOCA 0.13 has no image with a newer Python; the FOCA
# upgrade moves to the org's default Python
requires-python = ">=3.12"
description = "GA4GH Data Repository Service (DRS) implementation by ELIXIR On-Cloud"
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    # FOCA is bumped by hand, together with the base image in the
    # `Dockerfile`, which must have the locked FOCA release
    "foca>=0.13.0,<0.14",
    "gunicorn>=26.2.0,<27",
    "PyYAML>=6.0,<7",
    # FOCA 0.13 imports `pkg_resources`, which setuptools 82 removed; drop
    # with the FOCA upgrade (78.1.1 fixes CVE-2025-47273)
    "setuptools>=78.1.1,<82",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.10",
    "flake8>=7.3",
    "mongomock>=4.3",
    "packaging>=25.0",
    "pytest>=8.4",
    # Used by the tests; builds use `build-system.requires`
    "setuptools-scm>=8",
    # Locks the dependencies (`uv lock`); the tests export the lock with it
    "uv>=0.12",
]
# Documentation (MkDocs, as in the other FOCA apps of ELIXIR On-Cloud)
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings-python>=1.18,<3",
]

[dependency-groups]
# The build requirements of the app (the same as `build-system.requires`,
# checked by the tests), locked in `uv.lock` with their hashes, so that the
# image build installs them hash-checked
build-system = ["setuptools>=77", "setuptools-scm>=8"]

[tool.uv]
# FOCA 0.13 requires `typing`, the backport for Python 3.4 and earlier, which
# is useless on later Pythons (its latest release would even be locked, which
# refuses to install on them); left out of the lock. The base image has it
# already, so FOCA's requirement is still met there
override-dependencies = ["typing; python_version < '3.5'"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
homepage = "https://github.com/elixir-cloud-aai/drs-filer"
Issues = "https://github.com/elixir-cloud-aai/drs-filer/issues"

[tool.setuptools_scm]
# Version from Git tags (`vX.Y.Z`); builds without Git metadata (e.g., Docker
# builds, which get no `.git`) report the fallback unless
# `SETUPTOOLS_SCM_PRETEND_VERSION` is set
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["drs_filer*"]

[tool.setuptools.package-data]
drs_filer = [
    "config.yaml",
    "api/*.yaml",
]
