# FOCA configuration
server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode allows executing arbitrary code; only enable it for local
    # development, on a loopback host
    debug: False
    testing: False

db:
    host: mongodb
    port: 27017
    dbs:
        drsStore:
            collections:
                objects:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                service_info:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True

api:
    specs:
        drs:
            # The vendored GA4GH DRS specification, unchanged, named after
            # the date and the abbreviated hash of its commit, and the app's
            # changes and additions (`additions.openapi.yaml`), merged in
            # this order:
            # - DRS 1.5.0, `openapi.yaml` of `preview/release/drs-1.5.0/` on
            #   branch `gh-pages` of
            #   https://github.com/ga4gh/data-repository-service-schemas,
            #   bundled from commit fe25c39 (2025-03-24, tag `drs-1.5.0`);
            #   it includes the schemas of the GA4GH service info 1.0.0
            #   (`Service`, `ServiceType`), unchanged
            # Licensed under the Apache License 2.0
            path:
                - api/20250324.fe25c39.openapi.yaml
                - api/additions.openapi.yaml
            # All operations are routed to the controllers of the installed
            # package
            add_operation_fields:
                x-openapi-router-controller: drs_filer.ga4gh.drs.server
            connexion:
                strict_validation: True
                validate_responses: True
                options:
                    swagger_ui: True
                    serve_spec: True

log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Errors are answered with problem details (RFC 9457: `type`, `title`,
# `status`, `detail`)
exceptions:
    mapping: drs_filer.errors.exceptions.exceptions

# Service info (GA4GH `Service` schema), validated on startup and served by
# `GET /service-info` (until replaced with `POST /service-info`, see
# `docs/configuration.md`), with the DRS fields that the app computes
# (`maxBulkRequestLength`, `drs`); `version` is that of the installed package
# (`package`) unless set. `type.version` is the version of the DRS
# specification that the app serves. The values in reserved example domains
# are placeholders (FOCA warns of them on startup): deployments set their own
service_info:
    package: drs-filer
    service:
        id: "org.example.drs-filer"
        name: "DRS-Filer"
        type:
            group: "org.ga4gh"
            artifact: "drs"
            version: "1.5.0"
        description: "GA4GH Data Repository Service (DRS) implementation."
        organization:
            name: "Example Organization"
            url: "https://example.org"
        contactUrl: "mailto:drs@example.org"
        documentationUrl: "https://github.com/elixir-cloud-aai/drs-filer"
        environment: "dev"
        # Optional timestamps (RFC 3339), served only if set, e.g.:
        # createdAt: "2020-01-01T00:00:00Z"
        # updatedAt: "2026-11-18T00:00:00Z"

# Custom app configuration, validated on startup
# (`drs_filer.custom_config.CustomConfig`): unknown keys fail the start
custom:
    # Public URL of the app, for the `self_uri` of objects and the `Location`
    # of posted service info
    # (`<url_prefix>://<external_host>:<external_port>/<api_path>/...`);
    # deployments set their own
    service:
        url_prefix: http
        external_host: localhost
        external_port: 8080
        api_path: ga4gh/drs/v1
    # Generated identifiers: `length` characters drawn from those listed in
    # `charset` (the characters themselves, not an expression, which fails
    # the start), by default all unreserved characters of URLs, the only
    # ones allowed: letters, digits and `.-_~`
    objects:
        id:
            charset: &id_charset "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_~"
            length: 6
    access_methods:
        id:
            charset: *id_charset
            length: 6
