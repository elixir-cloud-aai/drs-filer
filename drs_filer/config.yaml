# FOCA configuration
server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode allows executing arbitrary code; only enable it for local
    # development, on a loopback host
    debug: False
    testing: False

# Authentication and access control, as in TRS-Filer and Cloud Registry:
# access URLs require an access token of any user (the patch
# `api/patches/login-for-access-urls.yaml` of `api.specs.drs.patches`), other
# reads are public; writes (registering, replacing and deleting objects and
# access methods, posting the service info) require an access token (the
# `security` of these operations in `api/additions.openapi.yaml`) and, until
# objects have owners (#95), the role `admin`. See `docs/access-control.md`
# Cf. https://foca.readthedocs.io/en/latest/configuration/auth/ and
# https://foca.readthedocs.io/en/latest/configuration/access-control/
security:
    auth:
        add_key_to_claims: True
        algorithms:
          - RS256
        allow_expired: False
        # Only access tokens as per RFC 9068 (`typ` header `at+jwt`); other
        # tokens of the issuers, such as ID tokens, are rejected
        verify_token_type: True
        # The identity providers, their claims and the groups mapped to roles
        # are deployment configuration, without defaults (see "Deployment
        # configuration" in `docs/configuration.md`). Deployments must set:
        # - `issuers`: the trusted token issuers (`iss` claim); tokens of
        #   other issuers are rejected, and the app refuses to start without
        #   any;
        # - `audience`: the audiences of the apps calling DRS-Filer (`aud`
        #   claim, usually the client IDs of portals, gateways or scripts);
        #   FOCA refuses to start without it, unless `verify_audience` is
        #   false.
        # E.g.:
        # issuers:
        #   - https://login.example.org/oidc/
        # audience:
        #   - drs-portal
        issuers: []
        # Claims that the identity provider releases via user info only, not
        # in access tokens, e.g., the group claim (`claim_groups`, needed for
        # the admin role); none by default. E.g.:
        # userinfo_claims:
        #   - groups
    # Access control: only admins may write, until objects have owners (#95);
    # admins may do everything (the model's matcher), and no rule allows
    # writes to other users. Policies are enforced on the operations that
    # require a token (the writes, the access URLs and the reads that
    # deployments require login for)
    # Cf. https://foca.readthedocs.io/en/latest/access-control/
    access_control:
        enabled: True
        enforce: True
        # Refuse to start if `enforce` is false, which would let any valid
        # token of a trusted issuer write, not only admins (FOCA)
        require_enforced: True
        model: access_control/model.conf
        db_name: drsStore
        collection_name: policy_rules
        # Deployments set the claim with the groups of users (`claim_groups`)
        # and map their admin groups (values of that claim) to the role
        # `admin` (`group_mapping`); the app refuses to start without them,
        # unless `require_admin` is false. E.g.:
        # claim_groups: groups
        # group_mapping:
        #   drs-admins: admin
        # Refuse to start without admins, i.e., unless a group is mapped to
        # the role `admin` (`group_mapping`) or a rule of `policies` grants
        # it (FOCA; false: start with a warning)
        require_admin: True
        # Managed on startup (removed rules are deleted); cannot be changed
        # via the permissions API. Named, so that overlays can add, change
        # or remove single rules by name (`null` removes a rule)
        policies:
            # Any authenticated user may read: get access URLs, list objects
            # and get an object. Only evaluated for the reads that require
            # login: access URLs by default, the other reads if a deployment
            # requires login for them (see "Requiring login for reads" in
            # `docs/access-control.md`). `HEAD` too, which Flask serves from
            # the `GET` operations and access control checks as `HEAD`
            get-access-urls: [p, "*", "/ga4gh/drs/v1/objects/:object_id/access/:access_id", "GET|HEAD"]
            list-objects: [p, "*", /ga4gh/drs/v1/objects, "GET|HEAD"]
            get-objects: [p, "*", "/ga4gh/drs/v1/objects/:object_id", "GET|HEAD"]

db:
    host: mongodb
    port: 27017
    dbs:
        drsStore:
            collections:
                objects:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                service_info:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True

api:
    specs:
        drs:
            # The vendored GA4GH DRS specification, unchanged, named after
            # the date and the abbreviated hash of its commit, and the app's
            # changes and additions (`additions.openapi.yaml`), merged in
            # this order:
            # - DRS 1.5.0, `openapi.yaml` of `preview/release/drs-1.5.0/` on
            #   branch `gh-pages` of
            #   https://github.com/ga4gh/data-repository-service-schemas,
            #   bundled from commit fe25c39 (2025-03-24, tag `drs-1.5.0`);
            #   it includes the schemas of the GA4GH service info 1.0.0
            #   (`Service`, `ServiceType`), unchanged
            # Licensed under the Apache License 2.0
            path:
                - api/20250324.fe25c39.openapi.yaml
                - api/additions.openapi.yaml
            # All operations are routed to the controllers of the installed
            # package
            add_operation_fields:
                x-openapi-router-controller: drs_filer.ga4gh.drs.server
            # Patches of the specification (FOCA), relative to this
            # directory: access URLs require login. Overlays replace the
            # list (lists aren't merged): leave a patch out to drop it (e.g.,
            # `patches: []` makes access URLs public), and list the patches
            # of the base config together with their own; e.g., add
            # `api/patches/login-for-reads.yaml` to require login for all
            # reads (see "Requiring login for reads" in
            # `docs/access-control.md`)
            patches:
                - api/patches/login-for-access-urls.yaml
            # FOCA's token validation, for the operations that require a
            # token (`security` of `BearerAuth`: the writes and access URLs)
            add_security_fields:
                x-bearerInfoFunc: foca.security.auth.validate_token
            # `True` removes the security requirements: all operations,
            # writes too, are public. For local development only (overlay
            # `config.noauth.yaml`, see "Running without authentication" in
            # `docs/development.md`), never for deployments
            disable_auth: False
            connexion:
                strict_validation: True
                validate_responses: True
                options:
                    swagger_ui: True
                    serve_spec: True

log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Errors are answered with problem details (RFC 9457: `type`, `title`,
# `status`, `detail`)
exceptions:
    mapping: drs_filer.errors.exceptions.exceptions

# Service info (GA4GH `Service` schema), validated on startup and served by
# `GET /service-info` (until replaced with `POST /service-info`, see
# `docs/configuration.md`), with the DRS fields that the app computes
# (`maxBulkRequestLength`, `drs`); `version` is that of the installed package
# (`package`) unless set. `type.version` is the version of the DRS
# specification that the app serves. The values in reserved example domains
# are placeholders (FOCA warns of them on startup): deployments set their own
service_info:
    package: drs-filer
    service:
        id: "org.example.drs-filer"
        name: "DRS-Filer"
        type:
            group: "org.ga4gh"
            artifact: "drs"
            version: "1.5.0"
        description: "GA4GH Data Repository Service (DRS) implementation."
        organization:
            name: "Example Organization"
            url: "https://example.org"
        contactUrl: "mailto:drs@example.org"
        documentationUrl: "https://github.com/elixir-cloud-aai/drs-filer"
        environment: "dev"
        # Optional timestamps (RFC 3339), served only if set, e.g.:
        # createdAt: "2020-01-01T00:00:00Z"
        # updatedAt: "2026-11-18T00:00:00Z"

# Custom app configuration, validated on startup
# (`drs_filer.custom_config.CustomConfig`): unknown keys fail the start
custom:
    # Public host name of the app, without scheme, port or path; required,
    # without default: each deployment sets its own (the start fails
    # without). The `self_uri` of each object is its DRS URI
    # (`drs://<hostname>/<id>`), which DRS clients resolve to
    # `https://<hostname>/ga4gh/drs/v1/objects/<id>` (port 443), e.g.:
    # drs:
    #     hostname: drs.example.org
    # Generated identifiers: `length` characters drawn from those listed in
    # `charset` (the characters themselves, not an expression, which fails
    # the start), by default all unreserved characters of URLs, the only
    # ones allowed: letters, digits and `.-_~`. Pages of the object list
    # (`GET /objects`): `default_page_size` objects unless the request sets
    # `pageSize`, at most `max_page_size` (larger `pageSize`s are reduced to
    # it); the default can't be larger than the maximum
    objects:
        id:
            charset: &id_charset "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_~"
            length: 6
        list:
            default_page_size: 50
            max_page_size: 200
    access_methods:
        id:
            charset: *id_charset
            length: 6
    # Stats of the objects in the service info (`drs.objectCount` and
    # `drs.totalObjectSize` of `GET /service-info`): `enabled: false` leaves
    # them out (e.g., where reads require login); they are computed from the
    # database and kept for `cache_seconds` in each process (`0`: computed
    # for each request)
    stats:
        enabled: true
        cache_seconds: 60
    # Bulk requests (the authorization info of several objects, `OPTIONS
    # /objects`): at most `max_request_length` identifiers, counted as sent;
    # more get `413`. Served as `maxBulkRequestLength` in the service info
    bulk:
        max_request_length: 100
