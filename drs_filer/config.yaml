# FOCA configuration
server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode allows executing arbitrary code; only enable it for local
    # development, on a loopback host
    debug: False
    testing: False

db:
    host: mongodb
    port: 27017
    dbs:
        drsStore:
            collections:
                objects:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True
                service_info:
                    indexes:
                        - keys:
                              id: 1
                          options:
                            'unique': True

api:
    specs:
        - path:
            - api/20200131.11d2c12.service-info.yaml
            - api/20200622.383121d.data_repository_service.swagger.yaml
            - api/additional.data_repository_service.swagger.yaml
          append: null
          # Each operation names the controllers of the installed package
          # (`drs_filer.ga4gh.drs.server`) itself
          connexion:
              strict_validation: True
              validate_responses: True
              options:
                  swagger_ui: True
                  serve_spec: True

log:
    version: 1
    disable_existing_loggers: False
    formatters:
        standard:
            class: logging.Formatter
            style: "{"
            format: "[{asctime}: {levelname:<8}] {message} [{name}]"
    handlers:
        console:
            class: logging.StreamHandler
            level: 20
            formatter: standard
            stream: ext://sys.stderr
    root:
        level: 10
        handlers: [console]

# Errors are answered with problem details (RFC 9457: `type`, `title`,
# `status`, `detail`)
exceptions:
    mapping: drs_filer.errors.exceptions.exceptions

# Custom app configuration
endpoints:
    # Generated identifiers: `id_length` characters drawn from those listed
    # in `id_charset` (the characters themselves, not an expression, which
    # fails the start), by default all unreserved characters of URLs, the
    # only ones allowed: letters, digits and `.-_~`
    objects:
        id_charset: &id_charset "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_~"
        id_length: 6
    access_methods:
        id_charset: *id_charset
        id_length: 6
    # Placeholders, to be replaced by each deployment's overlay (see
    # `docs/configuration.md`); served as they are, so they must conform to
    # the service info specification, including the formats of URLs (`uri`)
    # and timestamps (`date-time`), which responses are validated against
    service_info:
        id: "org.example.drs-filer"
        name: "DRS-Filer"
        type:
            group: "org.ga4gh"
            artifact: "drs"
            version: "1.1.0"
        description: "GA4GH Data Repository Service (DRS) implementation."
        organization:
            name: "Example Organization"
            url: "https://example.org"
        contactUrl: "mailto:drs@example.org"
        documentationUrl: "https://github.com/elixir-cloud-aai/drs-filer"
        createdAt: "2020-01-01T00:00:00Z"
        updatedAt: "2020-01-01T00:00:00Z"
        environment: "dev"
        version: "0.0.0"
    url_prefix: http
    external_host: 193.166.24.114
    external_port: 8080
    api_path: ga4gh/drs/v1
