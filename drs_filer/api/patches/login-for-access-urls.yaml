# Patch of the API specification (`api.specs.drs`) that requires login for
# access URLs (`GetAccessURL`): sets the security requirements of the
# operation to a bearer token (`BearerAuth`, the scheme of DRS). Applied by
# the base config (`api.specs.drs.patches` in `config.yaml`); objects are
# then served without access URLs. Deployments that leave it out of
# `patches` make access URLs public. See "Requiring login for reads" in
# `docs/access-control.md`
paths:
  "/objects/{object_id}/access/{access_id}":
    get:
      security:
        - BearerAuth: []
