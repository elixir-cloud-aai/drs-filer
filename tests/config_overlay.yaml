# Config overlay for app tests, with the settings each deployment must make:
# the public host name of the app, for the `self_uri` (DRS URI) of objects,
# and the identity provider, which is fictitious (and mocked by the tests,
# see `tests/conftest.py`), with the audience, the group claim and the admin
# group
custom:
  drs:
    hostname: drs.example.org
security:
  auth:
    issuers:
      - https://login.example.org/oidc/
    audience:
      - client-id
  access_control:
    claim_groups: groups
    group_mapping:
      drs-admins: admin
