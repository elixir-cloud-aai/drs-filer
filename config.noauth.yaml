# Config overlay that disables authentication, for local development only
# (e.g., to register objects without an identity provider); NEVER for
# deployments: with it, anybody who can reach the app can register, change
# and delete objects and set the service info. FOCA warns of it on startup.
# Merge it after `config.dev.yaml` (see "Running without authentication" in
# `docs/development.md`):
#   DRS_FILER_CONFIG_OVERLAY=/etc/drs-filer/config.dev.yaml:/etc/drs-filer/config.noauth.yaml docker compose up -d
api:
  specs:
    drs:
      disable_auth: True
