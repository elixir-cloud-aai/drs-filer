# Everything that must pass on pull requests and pushes to `dev`: the pull
# request title, lint, the docs build, test (against mongomock, with
# coverage, and against MongoDB), lint and test the Helm chart, install it
# on kind, the smoke test of the Docker Compose stack, the readiness of a
# release in preparation, the scan of the Docker image for known
# vulnerabilities, and, on pushes, push the Docker image by digest (with
# SBOM and provenance attestations), scan exactly that digest, then attest,
# sign (Sigstore) and tag it `dev` and `sha-<commit>` once all other jobs
# passed. Forks, which have none of the secrets, run the same checks
# without publishing, unless they set the repository variable
# `DOCKERHUB_ORG` to publish to their own organization.
# `github.repository_owner == 'elixir-cloud-aai'` marks runs of the upstream
# repository. The gate `passed` ("CI passed") is the only required check. No
# `paths:` filters, so that the gate always reports; skip jobs with `if:`
# instead (and allow the skip in the gate). Runs also when a pull request is
# edited, so that the title check follows the title; all jobs run then, as a
# run that skipped the tests would report "CI passed" for the commit.
# Releases are published by `release.yml`, which requires a successful run
# of this workflow for the push of the release commit

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

# The Docker Hub organization is the repository variable `DOCKERHUB_ORG` (by
# default `elixircloud`)
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/drs-filer
  # "true" if this run publishes the image: pushes to this repository, or to
  # a fork that sets `DOCKERHUB_ORG` (and the Docker Hub secrets). Jobs' `if:`
  # can't read `env`, so `push` and the gate repeat the expression
  # (`tests/test_workflows.py`)
  PUBLISH: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}

# Only a new head commit of a pull request cancels its runs in progress
# (action `synchronize`, first attempt); runs for other actions and reruns
# wait, so that a run on the same commit never leaves a cancelled, failed
# `CI passed` (see "Cancelled runs" in `actions/gate/README.md` of
# `elixir-cloud-aai/.github`). Runs for pushes get their own group, so that
# none is dropped. Runs for edits that leave the title unchanged share a
# group of their own, so that they don't wait for the run for the pull
# request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && github.event.action == 'synchronize'
    && github.run_attempt == 1 }}

jobs:

  # Pull request titles become the commit messages on `dev` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass,
  # unless someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # All jobs use the Python version of the base image in the `Dockerfile`
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # uv, at the version locked in `uv.lock` (a dev dependency)
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The lock must match `pyproject.toml` (run `uv lock` after changing
      # dependencies; `uv sync --locked` below checks it too, but this step
      # names the failure)
      - name: Check lock file
        run: uv lock --check
      # The versions of `uv.lock`, checked against its hashes, into `.venv`,
      # with the Python set up above. mypy checks imports, so runtime
      # dependencies are needed too
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # ruff, mypy, semgrep, ast-grep, gitleaks, actionlint and the other
      # hooks of `.pre-commit-config.yaml`, plus the secret scan of the whole
      # checkout
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all
      # In its own environment, as cffconvert pins an old jsonschema; its
      # dependencies resolve within its own bounds. 2.0.0 is the latest stable
      # release (not bumped by Dependabot; update manually)
      - name: Validate citation metadata
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff

  # The docs (`mkdocs.yml`, `docs/`), as Read the Docs builds them
  # (`.readthedocs.yaml`), with the versions of `uv.lock`
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python version of Read the Docs (`.readthedocs.yaml`)
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --extra docs --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict

  # The tests against mongomock (with coverage) and against MongoDB, the
  # database of deployments (`MONGODB_TEST_URI`, see `tests/conftest.py`), in
  # the version of `docker-compose.yaml`
  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mongomock
            image: ""
            uri: ""
          - database: MongoDB 7.0
            image: mongo:7.0
            uri: mongodb://localhost:27017
    services:
      # Not started for an empty image (the `mongomock` entry)
      mongodb:
        image: ${{ matrix.image }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_URI: ${{ matrix.uri }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # The chart tests (run if Helm is installed, as on GitHub's runners)
      # need the library chart, the version locked in `Chart.lock`
      - name: Build chart dependencies
        run: |
          # The library chart is then checked as when it was pinned: OCI
          # tags can be pushed again
          helm dependency build deployment
          (cd deployment && sha256sum -c charts.sha256)
      # Fails below 100% (`fail_under` in `pyproject.toml`)
      - name: Calculate unit test coverage
        if: ${{ matrix.uri == '' }}
        run: |
          coverage run -m pytest -W ignore::DeprecationWarning
          coverage report
          coverage xml
      # Upload errors fail the workflow only on branch pushes to the upstream
      # repository: pull requests from forks and Dependabot, and pushes in
      # forks, have no access to its Codecov token (so failures are
      # deliberately non-fatal there)
      - name: Submit Report to Codecov
        if: ${{ matrix.uri == '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true
      - name: Run tests against MongoDB
        if: ${{ matrix.uri != '' }}
        run: pytest -W ignore::DeprecationWarning

  # The Helm chart (`deployment/`) with FOCA's library chart: checks the
  # library chart against its digest, lints the chart and renders it
  # (`tests/test_chart.py`). `test` runs these tests too, with the runner's
  # Helm; this job with a pinned Helm version
  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Same Helm version as in the other chart job and `release.yml` (bump
      # all three by hand)
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      # The library chart foca-common, the version locked in `Chart.lock`
      - name: Build chart dependencies
        run: |
          # The library chart is then checked as when it was pinned: OCI
          # tags can be pushed again
          helm dependency build deployment
          (cd deployment && sha256sum -c charts.sha256)
      # With the values that users must pass (the Secret of MongoDB's
      # credentials and an identity provider with an admin group, so that the
      # templates render as installed), and with MongoDB without
      # authentication
      - name: Lint chart
        run: |
          helm lint deployment --strict -f deployment/ci/test-values.yaml
          helm lint deployment --strict -f deployment/ci/test-values.yaml \
            --set mongodb.auth.enabled=false --set mongodb.auth.existingSecret=
      # The tests fail instead of skipping if Helm is missing (`CI`)
      - name: Test chart
        run: |
          helm version
          pytest -W ignore::DeprecationWarning tests/test_chart.py

  # The chart as deployed in a cluster: installs it on kind (the defaults,
  # with the values of `deployment/ci/test-values.yaml`: a host name, a
  # fictitious identity provider with an admin group, and the Secret of
  # MongoDB's credentials, created here with random passwords), with the
  # image built from the commit, loaded into the cluster's node (pushed
  # nowhere, so the job needs no secrets and runs for pull requests from
  # forks), waits until the app is ready, and checks the API through a port
  # forward (the Ingress has no controller on kind): that writes need a
  # token, then, without authentication, an object's `self_uri`, with the
  # host name that the chart renders into the app's config overlay, and the
  # smoke test (`tests/smoke/`)
  chart-install:
    name: Chart install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLUSTER: drs-filer
      NAMESPACE: drs-filer
      # A local name, which no registry serves: the chart uses the image
      # loaded into the node (`imagePullPolicy: Never`)
      IMAGE: drs-filer:ci
      # The app's pods of the release `drs-filer`
      APP_PODS: app.kubernetes.io/instance=drs-filer,app.kubernetes.io/component=app
      API: http://localhost:8080/ga4gh/drs/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Helm version as in the other chart job and `release.yml` (bump
      # all three by hand)
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      # The library chart foca-common, as in `chart`
      - name: Build chart dependencies
        run: |
          helm dependency build deployment
          (cd deployment && sha256sum -c charts.sha256)
      # Dependabot updates the action, but not the kind version: bump it by
      # hand
      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: ${{ env.CLUSTER }}
      # The build gets no Git metadata, so the version is passed
      - name: Build and load image
        run: |
          docker build --build-arg SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+kind \
            --tag "${IMAGE}" .
          kind load docker-image "${IMAGE}" --name "${CLUSTER}"
      # The Secret named in `deployment/ci/test-values.yaml`; `--wait` waits
      # until the app and MongoDB are ready (readiness probes)
      - name: Install chart
        run: |
          kubectl create namespace "${NAMESPACE}"
          kubectl create secret generic drs-filer-mongodb-credentials \
            -n "${NAMESPACE}" \
            --from-literal=root-username=root \
            --from-literal=root-password="$(openssl rand -hex 24)" \
            --from-literal=username=drs-filer \
            --from-literal=password="$(openssl rand -hex 24)"
          helm install drs-filer deployment -n "${NAMESPACE}" \
            -f deployment/ci/test-values.yaml \
            --set drsFiler.image="${IMAGE}" \
            --set drsFiler.imagePullPolicy=Never \
            --wait --timeout 600s
      # A port forward to the app's Service, kept running for the next steps
      # (and restarted until the app answers, as it ends on a refused
      # connection); written to a script, which `Disable authentication`
      # runs again after the app restarted
      - name: Forward app port
        run: |
          forward="${RUNNER_TEMP}/forward.sh"
          cat > "${forward}" <<'EOF'
          log="${RUNNER_TEMP}/port-forward.log"
          kubectl rollout status deployment/drs-filer -n "${NAMESPACE}" \
            --timeout=300s
          pid=""
          for _ in $(seq 60); do
            if [[ -z "${pid}" ]] || ! kill -0 "${pid}" 2> /dev/null; then
              nohup kubectl port-forward -n "${NAMESPACE}" service/drs-filer \
                8080:8080 >> "${log}" 2>&1 &
              pid=$!
              sleep 2
            fi
            if curl --fail --silent --max-time 10 --output /dev/null \
                "${API}/service-info"; then
              exit 0
            fi
            sleep 5
          done
          cat "${log}"
          exit 1
          EOF
          bash "${forward}"
      # The app started with the settings of the test values (token issuer,
      # audience, admin group); reads are public, writes without a token get
      # `401`
      - name: Check authentication
        run: |
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            "${API}/objects"
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --max-time 30 -X POST \
            --header 'Content-Type: application/json' --data '{}' \
            "${API}/objects/register")"
          if [[ "${status}" != "401" ]]; then
            echo "::error::POST /objects/register: status ${status}, expected 401"
            exit 1
          fi
      # Writes without authentication (`config` value of the chart; for this
      # test only, see "Running without authentication" in
      # `docs/development.md`), to check the public URL that the chart sets
      # and for the smoke test; the changed value restarts the app (checksum
      # of its overlay), so the port forward is started again once the old
      # pods are gone
      - name: Disable authentication
        run: |
          old="$(kubectl get pods -n "${NAMESPACE}" -l "${APP_PODS}" -o name)"
          helm upgrade drs-filer deployment -n "${NAMESPACE}" --reuse-values \
            --set config.api.specs.drs.disable_auth=true \
            --wait --timeout 600s
          # shellcheck disable=SC2086 # one argument per pod
          kubectl wait --for=delete -n "${NAMESPACE}" ${old} --timeout=300s
          pkill -f "kubectl port-forward -n ${NAMESPACE}" || true
          bash "${RUNNER_TEMP}/forward.sh"
      # The `self_uri` of a registered object has the public URL that the
      # chart sets from `hostName` (of `deployment/ci/test-values.yaml`)
      - name: Check public URL
        env:
          HOST: drs.example.org
        run: |
          body="${RUNNER_TEMP}/body.json"
          object='{
            "checksums": [{"checksum": "abc", "type": "md5"}],
            "created_time": "2024-01-01T00:00:00Z",
            "size": 1,
            "access_methods": [{"type": "https", "access_url": {"url": "https://storage.example.org/x"}}]
          }'
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST --header 'Content-Type: application/json' \
            --data "${object}" --output "${body}" "${API}/objects/register"
          id="$(jq -r . "${body}")"
          curl --fail-with-body --silent --show-error --max-time 30 \
            --output "${body}" "${API}/objects/${id}"
          jq -e ".self_uri == \"https://${HOST}:443/ga4gh/drs/v1/${id}\"" "${body}" \
            || { cat "${body}"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X DELETE --output /dev/null "${API}/objects/${id}"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`, for the mock data
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      - name: Run smoke test
        env:
          DRS_FILER_URL: ${{ env.API }}
        run: pytest tests/smoke -v -W ignore::DeprecationWarning
      - name: Show cluster state
        if: failure()
        run: |
          kubectl get all,configmaps,pvc,networkpolicies -n "${NAMESPACE}" || true
          kubectl describe pods -n "${NAMESPACE}" || true
          # The pods of the app and of MongoDB
          kubectl logs -n "${NAMESPACE}" --all-containers --prefix \
            -l app.kubernetes.io/instance=drs-filer --tail=100 || true
          cat "${RUNNER_TEMP}/port-forward.log" || true
      - name: Tear down cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER}"

  # The app as Docker Compose runs it (image build, MongoDB, health checks):
  # writes need a token of the (fictitious) identity provider of
  # `config.dev.yaml`; then, without authentication (`config.noauth.yaml`),
  # the smoke test (`tests/smoke/`) against its API
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRS_FILER_URL: http://localhost:8080/ga4gh/drs/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start app
        # Waits until the containers are healthy (see their health checks)
        run: docker compose up --detach --build --wait --wait-timeout 300
      # Reads are public; writes without a token get `401` (before their
      # body is validated, so any body does)
      - name: Check authentication
        run: |
          check() {
            local method="$1" path="$2" status="$3" actual
            actual="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 -X "${method}" \
              --header 'Content-Type: application/json' --data '{}' \
              "${DRS_FILER_URL}${path}")"
            if [[ "${actual}" != "${status}" ]]; then
              echo "::error::${method} ${path}: status ${actual}, expected ${status}"
              return 1
            fi
          }
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            "${DRS_FILER_URL}/objects"
          check POST /objects/register 401
          check PUT /objects/smoke 401
          check DELETE /objects/smoke 401
          check DELETE /objects/smoke/access/smoke 401
          check POST /service-info 401
      # Writes without authentication (`config.noauth.yaml`, for local
      # development; see "Running without authentication" in
      # `docs/development.md`), for the smoke test: restarts the app with it
      - name: Disable authentication
        env:
          DRS_FILER_CONFIG_OVERLAY: /etc/drs-filer/config.dev.yaml:/etc/drs-filer/config.noauth.yaml
        run: docker compose up --detach --wait --wait-timeout 300
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The versions of `uv.lock`, as in `lint`, for the mock data
      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python "$(which python)"
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      - name: Run smoke test
        run: pytest tests/smoke -v -W ignore::DeprecationWarning
      - name: Show app logs
        if: failure()
        run: docker compose logs
      - name: Tear down app
        if: always()
        run: docker compose down --volumes

  # The release workflow's checks of pins and curated notes, before the
  # immutable tag exists: for the version in `CITATION.cff` (set before a
  # release, see "Versioning and releases" in `docs/development.md`) while
  # it has no tag, or its tag is on this commit. On pull requests and in
  # forks, findings are warnings (so that they don't fail the gate). On
  # pushes to the upstream repository, findings fail the run, which the
  # release workflow requires to pass for the release commit; they also hold
  # back the `dev` image (`publish` needs this job) until they are fixed
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scripts use the standard library only
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # In forks, findings are warnings too: forks often lack the upstream
      # repository's later tags, so released versions would look unreleased
      - name: Check pins and release notes
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          UPSTREAM: ${{ github.repository_owner == 'elixir-cloud-aai' }}
        run: |
          version="$(sed -En "s/^version:[[:space:]]*[\"']?([0-9A-Za-z.+-]+)[\"']?[[:space:]]*(#.*)?$/\1/p" CITATION.cff)"
          if [[ -z "${version}" ]]; then
              echo "No version in CITATION.cff: no release in preparation"
              exit 0
          fi
          # The commit of the (annotated) tag, if any: later commits are
          # skipped, but not the tagged commit itself (e.g., if it was
          # tagged before this job ran)
          tagged="$(git ls-remote origin "refs/tags/v${version}^{}" | cut -f1)"
          if [[ -n "${tagged}" && "${tagged}" != "${SHA}" ]]; then
              echo "v${version} is tagged: no release in preparation"
              exit 0
          fi
          level=error
          if [[ "${EVENT}" == "pull_request" || "${UPSTREAM}" != "true" ]]; then
              level=warning
          fi
          status=0
          python scripts/check_release_pins.py 2> pins.txt || status=1
          sed "s/^::error::/::${level}::/" pins.txt
          notes="docs/releases/${version}.md"
          if [[ -f "${notes}" ]]; then
              if grep -n "TODO" "${notes}"; then
                  echo "::${level}::${notes} contains TODO: finish the release notes before tagging v${version}"
                  status=1
              fi
              python scripts/release_notes.py check "${notes}" 2> notes.txt || status=1
              sed "s/^::error /::${level} /" notes.txt
          fi
          if [[ "${level}" == "error" ]]; then
              exit "${status}"
          fi

  # Builds the image and pushes it by digest only (untagged, with SBOM and
  # provenance attestations, `mode=max`), for `scan` to scan and `publish`
  # to sign and tag once all other jobs passed, as in `release.yml`. Runs
  # alongside the tests, so that the scan starts early; digests of runs that
  # fail (or fail the scan) are never signed or tagged, but stay on Docker
  # Hub, untagged (pullable by digest only). Pull requests (e.g., of
  # Dependabot and forks) and pushes in forks without `DOCKERHUB_ORG` get no
  # Docker Hub secrets and publish nothing; `scan` and the Compose build of
  # `smoke` build the image for them. Needs the environment `dev-images`,
  # with the secrets `DOCKERHUB_LOGIN` and `DOCKERHUB_TOKEN`, restricted to
  # branch `dev`: if it is missing, GitHub creates it on the first run,
  # unprotected and without the secrets, and the login fails
  push:
    name: Push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, to derive the version
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The Docker build gets no Git metadata, so the version (e.g.,
      # `0.3.1.dev4+g<commit>`) is passed as a build argument. It is derived
      # with the build requirements (the dependency group `build-system`),
      # exported from `uv.lock` by the uv image of the `Dockerfile` (pinned by
      # digest; without network, as `--frozen` reads the lock only), then
      # installed at the exact versions of the lock, checked against its
      # hashes, as wheels only, into a virtual environment of their own
      - name: Derive version
        id: version
        run: |
          uv_image="$(sed -En 's/^FROM (ghcr\.io\/astral-sh\/uv:[^ @]+@sha256:[0-9a-f]{64}) AS uv$/\1/p' Dockerfile)"
          if [[ -z "${uv_image}" ]]; then
            echo "::error::No uv image pinned by digest in the Dockerfile"
            exit 1
          fi
          requirements="${RUNNER_TEMP}/build-requirements.txt"
          docker run --rm --network none --tmpfs /tmp --env UV_NO_CACHE=1 \
            --volume "${PWD}/pyproject.toml:/src/pyproject.toml:ro" \
            --volume "${PWD}/uv.lock:/src/uv.lock:ro" "${uv_image}" \
            export --frozen --only-group build-system --no-emit-project \
            --project /src > "${requirements}"
          python -m venv "${RUNNER_TEMP}/build-env"
          "${RUNNER_TEMP}/build-env/bin/pip" install --require-hashes \
            --only-binary :all: --no-deps -r "${requirements}"
          version="$("${RUNNER_TEMP}/build-env/bin/python" -m setuptools_scm)"
          echo "Version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; the tags are set by
      # `publish`, after the scan
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}

  # Scans the image with Trivy (shared action
  # `elixir-cloud-aai/.github/actions/scan-image`): where `push` runs
  # (`PUBLISH`), exactly the digest that it pushed (`<image>@<digest>`;
  # public, so pulling it needs no login), otherwise (pull requests, forks
  # without `DOCKERHUB_ORG`) a local build; in a job without credentials or
  # signing permissions, as the Trivy action resolves the Trivy binary from a
  # mutable tag. The findings that have a fix are uploaded to code scanning
  # (only in this repository, and not for pull requests from forks, whose
  # token cannot write them), and the job fails on critical and high
  # vulnerabilities that have a fix. Accepted findings are listed, with a
  # reason and an expiry date, in `.trivyignore.yaml`. The release workflow
  # scans the release image the same way (`release.yml`), and `latest` is
  # scanned weekly (`scan.yml`)
  scan:
    name: Scan image
    # Skipped where `PUBLISH` is "false"
    needs: push
    if: ${{ !cancelled() && (needs.push.result == 'success' || needs.push.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: env.PUBLISH != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          # Single image, for the local Docker daemon (no attestations)
          provenance: false
          # Named as the pushed image, so that code scanning matches the
          # findings of both
          tags: ${{ env.IMAGE_NAME }}:scan
      - name: Determine image
        id: image
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ "${PUBLISH}" != "true" ]]; then
            echo "image=${IMAGE_NAME}:scan" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          image: ${{ steps.image.outputs.image }}
          category: image
          upload: ${{ github.repository_owner == 'elixir-cloud-aai' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}

  # Attests the build provenance of the scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it with Sigstore keyless
  # signing (`cosign`, via the workflow's OIDC token) and only then tags
  # exactly that digest `dev` and `sha-<commit>` (never `latest`, which is
  # for releases), once all other jobs passed, so that the published image is
  # the scanned one; see "Verifying images" in `docs/operations.md`. Only
  # the newest commit of the branch is tagged (the head check below), so
  # that an older run can't move `dev` back; no job-level concurrency group,
  # which would cancel pending jobs and fail their gates
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same expression as `PUBLISH` (`tests/test_workflows.py`)
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    needs: [lint, docs, test, chart, chart-install, smoke, readiness, push, scan]
    # Docker Hub secrets; the environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    env:
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" | cut -f1)
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Check image digest
        if: steps.head.outputs.current == 'true'
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${DIGEST}'"
            exit 1
          fi
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest build provenance
        if: steps.head.outputs.current == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        if: steps.head.outputs.current == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        if: steps.head.outputs.current == 'true'
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Of the scanned and signed digest. A single source is copied as is;
      # `sha-<commit>` first, so that `dev` never moves to an image without
      # its commit tag
      - name: Tag image
        if: steps.head.outputs.current == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          for tag in "${IMAGE_NAME}:sha-${SHA}" "${IMAGE_NAME}:dev"; do
            docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
            actual="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
            if [[ "${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
              exit 1
            fi
          done

  # Gate, the only check that the ruleset requires: fails if any other job
  # failed or was cancelled, or was skipped where it should have run. Only
  # `title` (on pushes and for Dependabot), and `push` and `publish` (where
  # `PUBLISH` is "false": pull requests, and forks without `DOCKERHUB_ORG`)
  # may be skipped. Every other job goes into `needs`
  # (`tests/test_workflows.py`)
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [title, lint, docs, test, chart, chart-install, smoke, readiness, push, scan, publish]
    if: always()
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: >-
            ${{ format('title {0} {1}',
              !(github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')) && 'push' || '',
              !(github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')) && 'publish' || '') }}
