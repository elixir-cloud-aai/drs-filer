name: Lint workflow

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  linting_and_tests:
    runs-on: ubuntu-latest

    name: Run linting and unit tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5.1.0
        with:
          # The Python of the base image (`Dockerfile`)
          python-version: "3.12"

      # The locked dependencies (`uv.lock`), with the `dev` extra, in
      # `.venv`; fails if the lock is out of date with `pyproject.toml`
      - name: Install dependencies
        run: |
          python -m pip install "uv>=0.12"
          uv sync --locked --extra dev --python "$(command -v python)"

      # ruff, mypy, ast-grep, semgrep and the other hooks of
      # `.pre-commit-config.yaml`, until the CI workflow replaces this one
      - name: Lint with pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Run unit tests with coverage
        run: |
          uv run --no-sync coverage run -m pytest
          uv run --no-sync coverage report -m

      # coveralls in an environment of its own, as it needs pydantic 2,
      # which conflicts with FOCA 0.13
      - name: Send coverage data to Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from "coveralls<4.1" coveralls
