name: Test Drs-filer API Endpoints

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.7

    # Waits until the health checks of both services pass
    - name: Build and run Docker Compose
      run: docker compose up --build --detach --wait --wait-timeout 180

    - name: Show the logs of the services
      if: failure()
      run: docker compose logs

    - name: Set up Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version: "3.12"

    # The locked dependencies, for the mock data of the smoke test
    - name: Install dependencies
      run: |
        python -m pip install "uv>=0.12"
        uv sync --locked --extra dev --python "$(command -v python)"

    - name: Run the smoke test
      run: |
        uv run --no-sync pytest tests/smoke -v -p no:warnings
      env:
        DRS_FILER_URL: http://localhost:8080/ga4gh/drs/v1

    - name: Stop and remove Docker Compose services
      run: docker compose down
