{{ if and (.Capabilities.APIVersions.Has "route.openshift.io/v1") (eq .Values.drs_filer.ingress false) }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: drs-filer
spec:
  host: {{ .Values.host_name }}
  port:
    targetPort: drs-filer
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: drs-filer
    weight: 100
  wildcardPolicy: None
{{ end }}
