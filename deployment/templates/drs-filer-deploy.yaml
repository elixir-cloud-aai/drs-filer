apiVersion: apps/v1
kind: Deployment
metadata:
  name: drs-filer
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: drs-filer
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      # Restart the app when its config changes
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/drs-filer-configmap.yaml") . | sha256sum }}
      labels:
        app: drs-filer
    spec:
      containers:
      - image: {{ .Values.drs_filer.image }}
        imagePullPolicy: Always
        name: drs-filer
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {{- toYaml .Values.drs_filer.resources | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        # The deployment's config overlay (`drs-filer-configmap.yaml`)
        env:
        - name: FOCA_CONFIG_OVERLAY
          value: /etc/drs-filer/config.yaml
        volumeMounts:
        - mountPath: /etc/drs-filer
          name: config-yaml
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
            - key: config.yaml
              path: config.yaml
          name: {{ .Values.drs_filer.appName }}-config
        name: config-yaml
status:
