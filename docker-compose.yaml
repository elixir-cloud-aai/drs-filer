version: '3.6'
services:

    drs:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        links: 
            - mongodb
        # Gunicorn, as set in the image (`CMD` of `Dockerfile`)
        command: ["gunicorn", "--config", "python:drs_filer.gunicorn_config", "drs_filer.app:create_app()"]
        ports:
            - "8080:8080"

    mongodb: 
        image: mongo:3.6
        restart: unless-stopped
        volumes:
            - ../data/drs/db:/data/db
        ports:
            - "27017:27017"
